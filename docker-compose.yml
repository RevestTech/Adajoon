name: adajoon

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: retv
      POSTGRES_PASSWORD: retv_secret
      POSTGRES_DB: retv
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "7352:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retv"]
      interval: 5s
      timeout: 3s
      retries: 5
    mem_limit: 512m

  redis:
    image: redis:7-alpine
    ports:
      - "7353:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    mem_limit: 256m

  backend:
    build: ./backend
    environment:
      ENV: dev
      DATABASE_URL: postgresql+asyncpg://retv:retv_secret@db:5432/retv
      SYNC_DATABASE_URL: postgresql://retv:retv_secret@db:5432/retv
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-jwt-secret-change-in-production-min-32-chars
      CORS_ORIGINS: http://localhost:7350
      WEBAUTHN_ORIGIN: http://localhost:7350
      WEBAUTHN_RP_ID: localhost
      # No app secret ever goes here or in a local .env - all of them
      # (TMDB_API_KEY, STRIPE_*, etc.) come from the real shared vault
      # (RevestTech/revest-vault), same as production. VAULT_ADDR/
      # VAULT_ROLE_ID/VAULT_SECRET_ID below have no value because they're
      # not meant to be hardcoded either: run this stack with
      # `railway run -- docker compose -p adajoon up -d` (from a directory
      # linked to the Adajoon Railway project) so Railway injects them from
      # the backend service's already-enrolled AppRole variables. Without
      # that, these are simply unset and config.py's _get_secret() falls
      # back to each key's own env var, which will also be unset - any
      # vault-only secret just reads as empty locally rather than failing
      # closed.
      VAULT_ADDR:
      VAULT_ROLE_ID:
      VAULT_SECRET_ID:
    ports:
      - "7351:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
    mem_limit: 512m
    cpus: 1.0

  worker:
    build: ./backend
    command: python -m app.worker
    environment:
      ENV: dev
      DATABASE_URL: postgresql+asyncpg://retv:retv_secret@db:5432/retv
      SYNC_DATABASE_URL: postgresql://retv:retv_secret@db:5432/retv
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-jwt-secret-change-in-production-min-32-chars
      # See the backend service's comment above - same no-hardcoded-secrets
      # policy, injected via `railway run` rather than set here.
      VAULT_ADDR:
      VAULT_ROLE_ID:
      VAULT_SECRET_ID:
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./backend/app:/app/app
    mem_limit: 512m
    cpus: 1.0

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "7350:80"
    depends_on:
      - backend
    mem_limit: 128m

volumes:
  pgdata:
